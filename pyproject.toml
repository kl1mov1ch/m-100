[project]
name = "m100-workspace"
version = "1.0.0"
description = "M-100: work reporting, projects, voice input and spreadsheet workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiohttp>=3.14.5,<4",
  "aiogram>=3.20,<4", "httpx>=0.28,<1", "google-auth>=2.38,<3",
  "requests>=2.32,<3", "python-dotenv>=1.0,<2", "tzdata>=2025.1",
  "aiohttp-socks>=0.12,<1", "socksio>=1,<2", "python-socks>=2.4.3,<3",
  "openpyxl>=3.1.5,<4", "xlrd>=2,<3", "defusedxml>=0.7,<1",
]

[project.scripts]
m100 = "stroybot.local:main"

[project.optional-dependencies]
voice = ["vosk==0.3.45"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stroybot*"]

[tool.setuptools.package-data]
stroybot = ["static/*.html", "static/*.css", "static/*.js", "static/*.png", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

